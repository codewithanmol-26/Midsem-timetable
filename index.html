<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CE Exam Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --paper:#FAFAF7;
    --paper-panel:#FFFFFF;
    --ink:#16283D;
    --ink-soft:#3C4E62;
    --blue:#2C5F8A;
    --blue-dim:#B9CCDA;
    --grid:#DCE3E8;
    --steel:#7C8B93;
    --orange:#E0590C;
    --orange-dim:#F6D9C6;
    --green:#2F7D5C;
    --radius:2px;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --paper:#12181F;
      --paper-panel:#182029;
      --ink:#EDEFF2;
      --ink-soft:#A9B6C2;
      --blue:#7FB0DC;
      --blue-dim:#2E4152;
      --grid:#26313C;
      --steel:#8996A2;
      --orange:#F0803E;
      --orange-dim:#3A2A1C;
      --green:#5FBE93;
    }
  }
  :root[data-theme="dark"]{
    --paper:#12181F;
    --paper-panel:#182029;
    --ink:#EDEFF2;
    --ink-soft:#A9B6C2;
    --blue:#7FB0DC;
    --blue-dim:#2E4152;
    --grid:#26313C;
    --steel:#8996A2;
    --orange:#F0803E;
    --orange-dim:#3A2A1C;
    --green:#5FBE93;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0/100% 28px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/28px 100%,
      var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Mono', monospace;
    min-height:100vh;
    padding: 28px 16px 64px;
  }

  .wrap{ max-width:920px; margin:0 auto; }

  /* header */
  header{
    display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between;
    gap:16px; border-bottom:2px solid var(--ink); padding-bottom:18px; margin-bottom:24px;
  }
  .title-block h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:clamp(28px, 5vw, 40px);
    line-height:1.05;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  .title-block p{
    margin:0; color:var(--steel); font-size:13px; max-width:46ch;
  }
  .dept-tag{
    font-size:12px; color:var(--blue); border:1px solid var(--blue-dim);
    padding:4px 10px; border-radius:20px; white-space:nowrap; letter-spacing:0.02em;
  }

  /* selector card */
  .panel{
    background:var(--paper-panel);
    border:1px solid var(--grid);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:24px;
  }
  .panel h2{
    font-family:'Space Grotesk', sans-serif;
    font-size:15px; font-weight:600; margin:0 0 14px; color:var(--ink);
  }
  .selector-row{
    display:flex; gap:12px; flex-wrap:wrap; align-items:center;
  }
  select, input[type="text"]{
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    padding:10px 12px;
    border:1px solid var(--grid);
    border-radius:var(--radius);
    background:var(--paper);
    color:var(--ink);
    min-width:180px;
  }
  select:focus, input:focus, button:focus{
    outline:2px solid var(--blue); outline-offset:1px;
  }
  .hint{ font-size:12px; color:var(--steel); margin-top:10px; }

  /* summary strip */
  .summary{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(120px,1fr));
    gap:1px;
    background:var(--grid);
    border:1px solid var(--grid);
    margin-bottom:24px;
    border-radius:var(--radius);
    overflow:hidden;
  }
  .summary .cell{
    background:var(--paper-panel);
    padding:14px 16px;
  }
  .summary .cell .num{
    font-family:'Space Grotesk', sans-serif;
    font-size:24px; font-weight:700; color:var(--ink);
    display:block;
  }
  .summary .cell .lbl{
    font-size:11px; color:var(--steel); letter-spacing:0.02em;
  }

  /* schedule timeline */
  .schedule{ position:relative; padding-left:26px; }
  .schedule::before{
    content:""; position:absolute; left:6px; top:6px; bottom:6px; width:2px;
    background:var(--blue-dim);
  }
  .exam-node{
    position:relative;
    background:var(--paper-panel);
    border:1px solid var(--grid);
    border-radius:var(--radius);
    padding:16px 18px;
    margin-bottom:14px;
  }
  .exam-node::before{
    content:""; position:absolute; left:-26px; top:22px;
    width:11px; height:11px; border-radius:50%;
    background:var(--paper); border:2px solid var(--blue);
  }
  .exam-node.today::before{ background:var(--orange); border-color:var(--orange); }
  .exam-node .row1{
    display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px;
    margin-bottom:8px;
  }
  .course-code{
    font-family:'Space Grotesk', sans-serif;
    font-size:19px; font-weight:600; color:var(--ink);
    letter-spacing:0.01em;
  }
  .date-badge{
    font-size:12px; color:var(--blue); font-weight:500;
  }
  .exam-node .row2{
    display:flex; gap:18px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-soft);
  }
  .exam-node .row2 span{ display:flex; gap:6px; align-items:center; }
  .exam-node .row2 b{ color:var(--ink); font-weight:600; }
  .day-label{
    font-size:11px; color:var(--steel); margin-bottom:2px; letter-spacing:0.03em;
  }

  .empty{
    text-align:center; padding:48px 20px; color:var(--steel); font-size:13px;
  }

  /* actions */
  .actions{ display:flex; gap:10px; margin: 20px 0 8px; flex-wrap:wrap; }
  button{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px; font-weight:500;
    padding:11px 18px;
    border-radius:var(--radius);
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    cursor:pointer;
  }
  button.secondary{
    background:transparent; color:var(--ink); border:1px solid var(--grid);
  }
  button:hover{ opacity:0.85; }
  button:disabled{ opacity:0.4; cursor:not-allowed; }

  footer{
    margin-top:40px; padding-top:16px; border-top:1px solid var(--grid);
    font-size:11px; color:var(--steel); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
  }

  @media (max-width:480px){
    .selector-row{ flex-direction:column; align-items:stretch; }
    select, input[type="text"]{ min-width:0; width:100%; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="title-block">
      <h1>Exam Schedule</h1>
      <p>Civil Engineering &mdash; Semester Examinations, September 2026</p>
    </div>
    <div class="dept-tag">DEPT. CE</div>
  </header>

  <div class="panel">
    <h2>Select your roll number</h2>
    <div class="selector-row">
      <select id="rollSelect" aria-label="Select roll number"></select>
      <button class="secondary" id="clearBtn" type="button">Clear selection</button>
    </div>
    <p class="hint" id="hintText">Your selection is saved on this device so it's here next time you open this page.</p>
  </div>

  <div id="summaryBox"></div>

  <div id="scheduleBox"></div>

  <div class="actions" id="actionsBox" style="display:none;">
    <button id="downloadPdfBtn" type="button">Download PDF</button>
    <button class="secondary" id="printBtn" type="button">Print</button>
  </div>

  <footer>
    <span id="footerLeft">Civil Engineering &middot; 93 students on record</span>
    <span>Times shown in Morning slot, 10:30 AM &ndash; 12:30 PM unless noted</span>
  </footer>

</div>

const STORAGE_KEY = 'ce_exam_schedule_roll';

// Build roll -> list of exams, sorted by date
const byRoll = {};
EXAMS.forEach(e => {
  if(!byRoll[e.roll]) byRoll[e.roll] = [];
  byRoll[e.roll].push(e);
});
const rolls = Object.keys(byRoll).sort();
rolls.forEach(r => byRoll[r].sort((a,b) => a.date.localeCompare(b.date)));

const rollSelect = document.getElementById('rollSelect');
const summaryBox = document.getElementById('summaryBox');
const scheduleBox = document.getElementById('scheduleBox');
const actionsBox = document.getElementById('actionsBox');
const hintText = document.getElementById('hintText');

// populate dropdown
const placeholder = document.createElement('option');
placeholder.value = '';
placeholder.textContent = '— choose a roll number —';
rollSelect.appendChild(placeholder);
rolls.forEach(r => {
  const opt = document.createElement('option');
  opt.value = r;
  opt.textContent = r;
  rollSelect.appendChild(opt);
});

function formatDate(iso){
  const d = new Date(iso + 'T00:00:00');
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return {
    day: days[d.getDay()],
    full: `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`
  };
}

function render(roll){
  scheduleBox.innerHTML = '';
  summaryBox.innerHTML = '';
  actionsBox.style.display = 'none';

  if(!roll || !byRoll[roll]){
    scheduleBox.innerHTML = '<div class="empty">Select a roll number above to see your exam schedule.</div>';
    return;
  }

  const list = byRoll[roll];

  // summary
  const firstDate = formatDate(list[0].date).full;
  const lastDate = formatDate(list[list.length-1].date).full;
  const rooms = [...new Set(list.map(e => e.room))].length;
  summaryBox.innerHTML = `
    <div class="summary">
      <div class="cell"><span class="num">${list.length}</span><span class="lbl">EXAMS</span></div>
      <div class="cell"><span class="num">${rooms}</span><span class="lbl">ROOMS ASSIGNED</span></div>
      <div class="cell"><span class="num" style="font-size:15px;">${firstDate}</span><span class="lbl">FIRST EXAM</span></div>
      <div class="cell"><span class="num" style="font-size:15px;">${lastDate}</span><span class="lbl">LAST EXAM</span></div>
    </div>
  `;

  const today = new Date().toISOString().slice(0,10);
  const wrap = document.createElement('div');
  wrap.className = 'schedule';
  list.forEach(e => {
    const {day, full} = formatDate(e.date);
    const node = document.createElement('div');
    node.className = 'exam-node' + (e.date === today ? ' today' : '');
    node.innerHTML = `
      <div class="day-label">${day}</div>
      <div class="row1">
        <span class="course-code">${e.course}</span>
        <span class="date-badge">${full}</span>
      </div>
      <div class="row2">
        <span>&#9201; <b>${e.time}</b></span>
        <span>&#9635; Room <b>${e.room}</b></span>
      </div>
    `;
    wrap.appendChild(node);
  });
  scheduleBox.appendChild(wrap);
  actionsBox.style.display = 'flex';
}

function loadSaved(){
  try{
    return localStorage.getItem(STORAGE_KEY) || '';
  }catch(e){ return ''; }
}
function saveRoll(roll){
  try{
    if(roll){ localStorage.setItem(STORAGE_KEY, roll); }
    else{ localStorage.removeItem(STORAGE_KEY); }
  }catch(e){ /* storage unavailable, ignore */ }
}

rollSelect.addEventListener('change', () => {
  saveRoll(rollSelect.value);
  render(rollSelect.value);
});

document.getElementById('clearBtn').addEventListener('click', () => {
  rollSelect.value = '';
  saveRoll('');
  render('');
});

document.getElementById('printBtn').addEventListener('click', () => window.print());

document.getElementById('downloadPdfBtn').addEventListener('click', () => {
  const roll = rollSelect.value;
  if(!roll || !byRoll[roll]) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const list = byRoll[roll];

  doc.setFont('helvetica','bold');
  doc.setFontSize(18);
  doc.text('Civil Engineering — Exam Schedule', 40, 50);

  doc.setFont('helvetica','normal');
  doc.setFontSize(11);
  doc.text(`Roll No: ${roll}`, 40, 72);
  doc.text(`Generated: ${new Date().toLocaleDateString()}`, 40, 88);

  let y = 120;
  doc.setFontSize(10);
  doc.setFont('helvetica','bold');
  doc.text('Date', 40, y);
  doc.text('Course', 160, y);
  doc.text('Time', 280, y);
  doc.text('Room', 440, y);
  y += 8;
  doc.setLineWidth(0.5);
  doc.line(40, y, 520, y);
  y += 16;

  doc.setFont('helvetica','normal');
  list.forEach(e => {
    const { day, full } = formatDate(e.date);
    if(y > 760){ doc.addPage(); y = 50; }
    doc.text(`${full}`, 40, y);
    doc.text(`(${day})`, 40, y + 12);
    doc.text(e.course, 160, y);
    doc.text(e.time, 280, y);
    doc.text(e.room, 440, y);
    y += 30;
  });

  doc.setFontSize(8);
  doc.setTextColor(140);
  doc.text('Times are in the Morning slot unless otherwise noted on the department notice board.', 40, 810);

  doc.save(`CE_Exam_Schedule_${roll}.pdf`);
});

// init
const saved = loadSaved();
if(saved && byRoll[saved]){
  rollSelect.value = saved;
  render(saved);
} else {
  render('');
}
